version: "3"

vars:
  APP: tileclaw
  BUILD_DIR: build

tasks:
  default:
    desc: Build and package Linux amd64
    cmds:
      - task: package:linux

  build:
    desc: Build target platform
    cmds:
      - rm -rf {{.BUILD_DIR}}/{{.GOOS}}-{{.GOARCH}}
      - mkdir -p {{.BUILD_DIR}}/{{.GOOS}}-{{.GOARCH}}
      - go build -trimpath -ldflags="-s -w" -o {{.BUILD_DIR}}/{{.GOOS}}-{{.GOARCH}}/{{.BIN}} .
    env:
      GOOS: "{{.GOOS}}"
      GOARCH: "{{.GOARCH}}"
      CGO_ENABLED: "0"
      GOCACHE: "{{.TASKFILE_DIR}}/.gocache"
    vars:
      BIN: '{{if eq .GOOS "windows"}}tileclaw.exe{{else}}tileclaw{{end}}'

  build:linux:
    desc: Build Linux amd64
    cmds:
      - task: build
        vars:
          GOOS: linux
          GOARCH: amd64

  build:linux-arm:
    desc: Build Linux arm64
    cmds:
      - task: build
        vars:
          GOOS: linux
          GOARCH: arm64

  build:windows:
    desc: Build Windows amd64
    cmds:
      - task: build
        vars:
          GOOS: windows
          GOARCH: amd64

  build:mac:
    desc: Build macOS amd64
    cmds:
      - task: build
        vars:
          GOOS: darwin
          GOARCH: amd64

  build:mac-arm:
    desc: Build macOS arm64
    cmds:
      - task: build
        vars:
          GOOS: darwin
          GOARCH: arm64

  package:linux:
    desc: Build and package Linux amd64
    deps: [build:linux]
    cmds:
      - mkdir -p {{.BUILD_DIR}}/linux-amd64/conf
      - cp conf/conf.toml conf/mail.example.toml {{.BUILD_DIR}}/linux-amd64/conf/
      - cp -r geojson {{.BUILD_DIR}}/linux-amd64/
      - cp scripts/start.sh scripts/stop.sh {{.BUILD_DIR}}/linux-amd64/
      - chmod +x {{.BUILD_DIR}}/linux-amd64/tileclaw {{.BUILD_DIR}}/linux-amd64/start.sh {{.BUILD_DIR}}/linux-amd64/stop.sh
      - 'echo "package output: {{.BUILD_DIR}}/linux-amd64"'

  package:linux-arm:
    desc: Build and package Linux arm64
    deps: [build:linux-arm]
    cmds:
      - mkdir -p {{.BUILD_DIR}}/linux-arm64/conf
      - cp conf/conf.toml conf/mail.example.toml {{.BUILD_DIR}}/linux-arm64/conf/
      - cp -r geojson {{.BUILD_DIR}}/linux-arm64/
      - cp scripts/start.sh scripts/stop.sh {{.BUILD_DIR}}/linux-arm64/
      - chmod +x {{.BUILD_DIR}}/linux-arm64/tileclaw {{.BUILD_DIR}}/linux-arm64/start.sh {{.BUILD_DIR}}/linux-arm64/stop.sh
      - 'echo "package output: {{.BUILD_DIR}}/linux-arm64"'

  package:windows:
    desc: Build and package Windows amd64
    deps: [build:windows]
    cmds:
      - mkdir -p {{.BUILD_DIR}}/windows-amd64/conf
      - cp conf/conf.toml conf/mail.example.toml {{.BUILD_DIR}}/windows-amd64/conf/
      - cp -r geojson {{.BUILD_DIR}}/windows-amd64/
      - cp scripts/start.bat scripts/stop.bat {{.BUILD_DIR}}/windows-amd64/
      - 'echo "package output: {{.BUILD_DIR}}/windows-amd64"'

  package:mac:
    desc: Build and package macOS amd64
    deps: [build:mac]
    cmds:
      - mkdir -p {{.BUILD_DIR}}/darwin-amd64/conf
      - cp conf/conf.toml conf/mail.example.toml {{.BUILD_DIR}}/darwin-amd64/conf/
      - cp -r geojson {{.BUILD_DIR}}/darwin-amd64/
      - cp scripts/start.sh scripts/stop.sh {{.BUILD_DIR}}/darwin-amd64/
      - chmod +x {{.BUILD_DIR}}/darwin-amd64/tileclaw {{.BUILD_DIR}}/darwin-amd64/start.sh {{.BUILD_DIR}}/darwin-amd64/stop.sh
      - 'echo "package output: {{.BUILD_DIR}}/darwin-amd64"'

  package:mac-arm:
    desc: Build and package macOS arm64
    deps: [build:mac-arm]
    cmds:
      - mkdir -p {{.BUILD_DIR}}/darwin-arm64/conf
      - cp conf/conf.toml conf/mail.example.toml {{.BUILD_DIR}}/darwin-arm64/conf/
      - cp -r geojson {{.BUILD_DIR}}/darwin-arm64/
      - cp scripts/start.sh scripts/stop.sh {{.BUILD_DIR}}/darwin-arm64/
      - chmod +x {{.BUILD_DIR}}/darwin-arm64/tileclaw {{.BUILD_DIR}}/darwin-arm64/start.sh {{.BUILD_DIR}}/darwin-arm64/stop.sh
      - 'echo "package output: {{.BUILD_DIR}}/darwin-arm64"'

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -rf {{.BUILD_DIR}}

  run:
    desc: Build and run locally
    deps: [build:windows]
    cmds:
      - ./{{.BUILD_DIR}}/windows-amd64/tileclaw.exe -c conf/conf.toml
